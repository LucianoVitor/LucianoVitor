name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & Generate Pacman
        run: |
          pip install requests svgwrite
          python - << 'EOF'
          import os, requests, math

          user = "LucianoVitor"
          url = f"https://github-contributions-api.jogruber.de/v4/{user}?y=last"
          res = requests.get(url).json()

          contributions = res.get("contributions", [])
          if not contributions:
              raise Exception("Could not fetch contributions")

          # Create dist folder
          os.makedirs("dist", exist_ok=True)

          # SVG Template dimensions
          cols = math.ceil(len(contributions) / 7)
          width = cols * 14 + 50
          height = 7 * 14 + 40

          def generate_svg(is_dark=False):
              bg = "#0d1117" if is_dark else "#ffffff"
              empty_color = "#161b22" if is_dark else "#ebedf0"
              colors = ["#0e4429", "#006d32", "#26a641", "#39d353"] if is_dark else ["#9be9a8", "#40c463", "#30a14e", "#216e39"]
              
              svg_lines = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">',
                  f'<rect width="100%" height="100%" fill="{bg}" rx="6"/>',
                  f'<g transform="translate(25, 20)">'
              ]
              
              for idx, c in enumerate(contributions):
                  col = idx // 7
                  row = idx % 7
                  x = col * 14
                  y = row * 14
                  lvl = c.get("level", 0)
                  fill = empty_color if lvl == 0 else colors[min(lvl-1, 3)]
                  svg_lines.append(f'<rect x="{x}" y="{y}" width="10" height="10" rx="2" fill="{fill}" />')

              # Pacman & Ghost icons
              svg_lines.append(f'<circle cx="{cols*14 - 20}" cy="45" r="7" fill="#ffd700" />')
              svg_lines.append(f'<polygon points="{cols*14 - 20},45 {cols*14 - 13},40 {cols*14 - 13},50" fill="{bg}" />')
              svg_lines.append(f'<circle cx="{cols*14 - 45}" cy="45" r="6" fill="#ff0000" />')
              svg_lines.append(f'<circle cx="{cols*14 - 70}" cy="45" r="6" fill="#ffb8ff" />')
              svg_lines.append('</g></svg>')
              return "\n".join(svg_lines)

          with open("dist/pacman-contribution-graph.svg", "w") as f:
              f.write(generate_svg(False))

          with open("dist/pacman-contribution-graph-dark.svg", "w") as f:
              f.write(generate_svg(True))
          EOF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
